# =============================================================================
# ML Platform - Backend Service (FastAPI)
# =============================================================================
# Runs on control plane node for API serving
# Handles: Model inference, training job submission, file uploads
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-backend
  namespace: ml-platform
  labels:
    app.kubernetes.io/name: ml-platform
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-backend
  template:
    metadata:
      labels:
        app: ml-backend
        app.kubernetes.io/name: ml-platform
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: ml-platform-sa
      # Schedule on control plane (has storage access)
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: backend
          image: mlplatformacrwqckxk.azurecr.io/ml-backend:v11-azure-auth
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MODELS_DIR
              valueFrom:
                configMapKeyRef:
                  name: ml-platform-config
                  key: MODELS_DIR
            - name: UPLOAD_DIR
              valueFrom:
                configMapKeyRef:
                  name: ml-platform-config
                  key: UPLOAD_DIR
            - name: AZURE_RESOURCE_GROUP
              value: "rg-mlplatform-auto"
            - name: AZURE_GPU_VM_NAME
              value: "vm-mlplatform-gpu"
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-sp-credentials
                  key: AZURE_CLIENT_ID
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: azure-sp-credentials
                  key: AZURE_CLIENT_SECRET
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-sp-credentials
                  key: AZURE_TENANT_ID
          volumeMounts:
            - name: models
              mountPath: /mnt/models
            - name: uploads
              mountPath: /mnt/uploads
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc-cp
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc-cp
      imagePullSecrets:
        - name: acr-secret

---
apiVersion: v1
kind: Service
metadata:
  name: ml-backend
  namespace: ml-platform
  labels:
    app.kubernetes.io/name: ml-platform
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: ml-backend

---
# NodePort for external access (development)
apiVersion: v1
kind: Service
metadata:
  name: ml-backend-external
  namespace: ml-platform
  labels:
    app.kubernetes.io/name: ml-platform
    app.kubernetes.io/component: backend
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
      protocol: TCP
      name: http
  selector:
    app: ml-backend
