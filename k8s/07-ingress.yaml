# =============================================================================
# ML Platform - NGINX Ingress Configuration
# =============================================================================
# Provides single entry point with path-based routing:
#   /         -> Frontend (Streamlit)
#   /api      -> Backend (FastAPI)
#   /jupyter  -> JupyterLab
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-platform-ingress
  namespace: ml-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket support for JupyterLab
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
    # Rewrite paths for backend API
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Frontend (Streamlit) - root path
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ml-frontend
                port:
                  number: 8501
          # Backend API
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ml-backend
                port:
                  number: 8000
          # JupyterLab
          - path: /jupyter(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ml-jupyterlab
                port:
                  number: 8888
---
# Additional Ingress for API without path rewrite (direct access)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-platform-api-ingress
  namespace: ml-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Backend API with path rewrite: /api/health -> /health
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ml-backend
                port:
                  number: 8000
