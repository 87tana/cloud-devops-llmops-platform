name: Deploy JupyterLab

on:
  push:
    branches: [main, tannaz_gpt2_shakespeare]
    paths:
      - 'docker/jupyterlab/**'
      - 'k8s/05-jupyterlab.yaml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    uses: ./.github/workflows/deploy-image.yml
    with:
      image_name: ml-jupyter
      docker_context: docker/jupyterlab
      deployment_name: ml-jupyterlab
    secrets: inherit
