name: Deploy Frontend

on:
  push:
    branches: [main, tannaz_gpt2_shakespeare]
    paths:
      - 'docker/frontend/**'
      - 'k8s/04-frontend.yaml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    uses: ./.github/workflows/deploy-image.yml
    with:
      image_name: ml-frontend
      docker_context: docker/frontend
      deployment_name: ml-frontend
    secrets: inherit
